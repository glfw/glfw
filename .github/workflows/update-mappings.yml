# Requires "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General -> Workflow permissions. Without it the branch is still
# pushed, but opening the pull request fails with
# "GitHub Actions is not permitted to create or approve pull requests".
name: Update mappings

on:
    schedule:
        # 04:00 UTC on the first of each month
        - cron: '0 4 1 * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update-mappings:
        name: Regenerate gamepad mappings
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - uses: actions/checkout@v5

            # same command as the update_mappings target in src/CMakeLists.txt
            - name: Regenerate mappings.h
              working-directory: src
              run: cmake -P ../CMake/GenerateMappings.cmake mappings.h.in mappings.h

            - name: Check for changes
              id: check
              run: |
                  if git diff --quiet -- src/mappings.h; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "mappings.h is already up to date"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      git diff --shortstat -- src/mappings.h
                  fi

            - name: Open or update pull request
              if: steps.check.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ci/update-gamepad-mappings
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git switch -c "$BRANCH"
                  git commit -m 'Update gamepad mappings from upstream' -- src/mappings.h
                  git push --force origin "$BRANCH"

                  # a still-open PR from this branch just picks up the push
                  if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
                      gh pr create --base '${{ github.ref_name }}' --head "$BRANCH" \
                          --title 'Update gamepad mappings from upstream' \
                          --body 'Generated by `.github/workflows/update-mappings.yml`, which runs the
                  `update_mappings` target against
                  [SDL_GameControllerDB](https://github.com/mdqinc/SDL_GameControllerDB).

                  No hand edits. Close this PR to skip the current upstream state; the next scheduled
                  run will reopen it if the mappings change again.'
                  fi
